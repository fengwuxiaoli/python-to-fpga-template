<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- ~10% outer margin (safe box 14..114), transparent background -->
  <!-- FPGA IC pins -->
  <g stroke="#0284C7" stroke-width="4" stroke-linecap="round">
    <line x1="42" y1="16" x2="42" y2="28" />
    <line x1="64" y1="16" x2="64" y2="28" />
    <line x1="86" y1="16" x2="86" y2="28" />
    <line x1="42" y1="100" x2="42" y2="112" />
    <line x1="64" y1="100" x2="64" y2="112" />
    <line x1="86" y1="100" x2="86" y2="112" />
    <line x1="16" y1="42" x2="28" y2="42" />
    <line x1="16" y1="64" x2="28" y2="64" />
    <line x1="16" y1="86" x2="28" y2="86" />
    <line x1="100" y1="42" x2="112" y2="42" />
    <line x1="100" y1="64" x2="112" y2="64" />
    <line x1="100" y1="86" x2="112" y2="86" />
  </g>
  <!-- High-contrast FPGA die body -->
  <rect x="28" y="28" width="72" height="72" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="4" />
  <!-- Pin-1 chamfer dot -->
  <circle cx="40" cy="40" r="3.5" fill="#F59E0B" />
  <!-- Python-to-Bitstream DSP waveform inside die -->
  <path d="M36 68 C43 44, 51 44, 58 64 C65 84, 73 84, 80 56 C84 44, 88 52, 92 64" stroke="#2DD4BF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Discrete sample stems -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round">
    <line x1="46" y1="50" x2="46" y2="86" opacity="0.6" />
    <line x1="64" y1="64" x2="64" y2="86" opacity="0.6" />
    <line x1="82" y1="54" x2="82" y2="86" opacity="0.6" />
  </g>
</svg>
